[Localization]
local_translation_path = local/translations/

[Contact_Command]
enabled = true

[Whois_Command]
enabled = true
hamqth_username=WT0F
hamqth_password=

# ────────────────────────────────────────────────────────────────────────────
# Room Server Bridge
#
# Listens on watch_channel and forwards each message as a DM to room_server_name,
# preserving the original sender's name.  Enable/disable at runtime with the
# command whose keyword is set in command_keyword (default: bridge).
#   !bridge on      — enable forwarding
#   !bridge off     — disable forwarding
#   !bridge status  — report current state and queue depth
# ────────────────────────────────────────────────────────────────────────────
[RoomServerBridge]
enabled = true

# Channel to watch for incoming messages
watch_channel = Public

# Name (or public-key prefix) of the room server contact to DM
room_server_name = MyRoomServer

# Whether forwarding is active when the service starts
bridge_enabled = true

# Keyword used to enable/disable bridging via bot command
command_keyword = bridge

# Include the original sender's name in the forwarded DM
include_sender_name = true

# Template for forwarded DMs.  Placeholders: {sender}, {message}
dm_template = [{sender}] {message}

# DM retry settings
max_retries = 3
retry_delay = 2.0
max_queue_age = 300

# ────────────────────────────────────────────────────────────────────────────
# Room Server Bridge — Announcements
#
# Each entry schedules an independent announcement.
# Format:  <cron_expression> = <type>:<target>:<message>
#
#   type    — "channel" (send to a MeshCore channel) or "room" (DM the room server)
#   target  — channel name (e.g. Public) or room-server contact name
#   message — text to send; use \n for a newline, \\n for a literal backslash-n
#
# Schedule formats (same as [Scheduled_Messages]):
#   5-field crontab  — 0 9 * * *   (daily at 09:00 in [Bot] timezone)
#   Preset aliases   — @daily, @hourly, @weekly, @monthly, @yearly
#
# Multiple entries may share the same cron expression as long as the key
# strings differ — append a unique suffix after a space or use a different
# schedule time.
#
# Examples (uncomment to activate):
# ────────────────────────────────────────────────────────────────────────────
[RoomServerBridge_Announcements]
# Morning greeting on the channel
#0 9 * * * = channel:Public:Good morning! The room server bridge is active.

# Evening check-in sent directly to the room server
#0 18 * * * = room:MyRoomServer:Evening check-in from the mesh bridge.

# Hourly ping to the channel
#@hourly = channel:Public:Hourly bridge ping.

# Weekly summary sent to the room server every Monday at noon
#0 12 * * mon = room:MyRoomServer:Weekly check-in — bridge is up and running.
